<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Manchester by Night — Player Guide</title>
<style>
  html,body{margin:0; padding:0; height:100%; background:#0d0a09;}
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia, 'Times New Roman', serif; color:#c9bfa9;
  }
  a{color:#c98a3e;}
</style>
<script>
  // Always redirect to a never-before-seen URL, so the browser has no
  // cached copy to fall back on and is forced to fetch the latest guide.
  var fresh = 'guide.html?t=' + Date.now();
  location.replace(fresh);
</script>
</head>
<body>
  <p>Loading the latest guide&hellip; if nothing happens, <a id="fallback" href="guide.html">click here</a>.</p>
  <script>
    document.getElementById('fallback').href = 'guide.html?t=' + Date.now();
  </script>
</body>
</html>
